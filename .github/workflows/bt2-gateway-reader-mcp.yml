name: BT2 restricted gateway to SQL Connectome MCP qualification

on:
  pull_request:
    paths:
      - 'src/sql_connectome/db.py'
      - 'src/sql_connectome/mcp_server.py'
      - 'tests/test_bt2_gateway_live_mcp.py'
      - '.github/workflows/bt2-gateway-reader-mcp.yml'
  push:
    branches: [main]
    paths:
      - 'src/sql_connectome/db.py'
      - 'src/sql_connectome/mcp_server.py'
      - 'tests/test_bt2_gateway_live_mcp.py'
      - '.github/workflows/bt2-gateway-reader-mcp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restricted-gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        pg_major: ['16', '17']
    services:
      postgres:
        image: postgres:${{ matrix.pg_major }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bt2_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d bt2_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: ${{ matrix.pg_major == '17' && 'postgresql://bt2admin:bt2admin@localhost:5432/bt2_ci' || 'postgresql://postgres:postgres@localhost:5432/bt2_ci' }}
      BT2_CI_TLS_ADMIN_DSN: postgresql://postgres:postgres@localhost:5432/bt2_ci
      BT2_CI_PG_MAJOR: ${{ matrix.pg_major }}
      BT2_SQL_GATEWAY_EPHEMERAL_QUALIFICATION: '1'
      PYTHONDONTWRITEBYTECODE: '1'

    steps:
      - name: Checkout SQL Connectome under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Checkout exact reviewed BT2 gateway source candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: thebrazenbeard/bt2
          ref: e741dd35223ef3bac76c1af61ec0a998a2929137
          path: bt2-source
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Bind disposable PostgreSQL container and managed-owner role
        run: |
          test "$(docker inspect '${{ job.services.postgres.id }}' --format '{{.Config.Image}}')" = 'postgres:${{ matrix.pg_major }}'
          test "$(docker inspect '${{ job.services.postgres.id }}' --format '{{.State.Running}}')" = 'true'
          echo "POSTGRES_CONTAINER_ID=${{ job.services.postgres.id }}" >> "$GITHUB_ENV"
          if [ '${{ matrix.pg_major }}' = '17' ]; then
            psql "$BT2_CI_TLS_ADMIN_DSN" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE bt2admin LOGIN PASSWORD 'bt2admin' CREATEDB CREATEROLE NOSUPERUSER;
          ALTER DATABASE bt2_ci OWNER TO bt2admin;
          SQL
          fi

      - name: Verify frozen V4 source and rebuild blank PostgreSQL
        working-directory: bt2-source
        run: |
          python tools/qualification/test_lantern_postgresql_v4_source_binding.py
          if [ '${{ matrix.pg_major }}' = '17' ]; then
            python tools/qualification/run_postgres17_blank_rebuild_compatibility.py \
              --database-url "$DATABASE_URL" \
              --postgres-container-id "$POSTGRES_CONTAINER_ID" \
              --evidence-out "$RUNNER_TEMP/bt2_rebuild_evidence.json"
          else
            python tools/qualification/run_postgres16_blank_rebuild.py \
              --database-url "$DATABASE_URL" \
              --postgres-container-id "$POSTGRES_CONTAINER_ID" \
              --evidence-out "$RUNNER_TEMP/bt2_rebuild_evidence.json"
          fi

      - name: Install opt-in BT2 gateway and qualify external reader ACL/TLS
        working-directory: bt2-source
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE bt2_lantern_gateway_owner_v1 NOLOGIN NOINHERIT NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;
          CREATE ROLE bt2_lantern_gateway_reader_v1 LOGIN NOINHERIT NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;
          GRANT bt2_lantern_gateway_owner_v1 TO CURRENT_USER WITH SET TRUE, INHERIT FALSE;
          GRANT bt2_lantern_gateway_reader_v1 TO CURRENT_USER WITH SET TRUE, INHERIT FALSE;
          SQL
          bash .github/scripts/lantern_gateway_login_tls_ci.sh preflight
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f native/project/lantern_read_gateway_v1_candidate.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f native/project/lantern_read_gateway_v1_rollback_test.sql
          bash .github/scripts/lantern_gateway_login_tls_ci.sh reader

      - name: Install SQL Connectome and apply migrations using disposable admin
        run: |
          python -m pip install -e '.[dev]'
          SQL_CONNECTOME_DATABASE_URL="$BT2_CI_TLS_ADMIN_DSN" python scripts/apply_migrations.py

      - name: Exercise real MCP gateway through distinct TLS reader LOGIN
        run: |
          umask 077
          reader_password="$(openssl rand -hex 24)"
          test "${#reader_password}" -eq 48
          printf "ALTER ROLE bt2_lantern_gateway_reader_v1 PASSWORD '%s';\n" "$reader_password" | \
            psql "$BT2_CI_TLS_ADMIN_DSN" -v ON_ERROR_STOP=1 >/dev/null
          export PGPASSWORD="$reader_password"
          export SQL_CONNECTOME_DATABASE_URL="postgresql://bt2_lantern_gateway_reader_v1@localhost:5432/bt2_ci?sslmode=verify-full&sslrootcert=$RUNNER_TEMP/bt2-gateway-pg${{ matrix.pg_major }}.crt"
          python -m pytest -q tests/test_bt2_gateway_live_mcp.py

      - name: Print only bounded immutable BT2 rebuild evidence
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/bt2_rebuild_evidence.json"; then
            cat "$RUNNER_TEMP/bt2_rebuild_evidence.json"
          fi
