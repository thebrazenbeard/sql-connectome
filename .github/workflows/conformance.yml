name: Conformance Snapshot

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "41 9 * * 4"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conformance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: sql_connectome
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sql_connectome"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      SQL_CONNECTOME_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sql_connectome
      SQL_CONNECTOME_API_TOKEN: conformance-test-token
      SQL_CONNECTOME_READ_SCHEMAS: bt2,public,sql_connectome

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e '.[dev]'

      - name: Apply migrations
        run: python scripts/apply_migrations.py

      - name: Generate conformance snapshot
        run: python scripts/generate_conformance_snapshot.py artifacts/conformance-snapshot.json

      - name: Generate differential conformance
        run: >-
          python scripts/generate_differential_conformance.py
          artifacts/differential-conformance.json

      - name: Upload conformance snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sql-connectome-conformance-${{ github.sha }}
          path: |
            artifacts/conformance-snapshot.json
            artifacts/differential-conformance.json
          if-no-files-found: error
          retention-days: 30
