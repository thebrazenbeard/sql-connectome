name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: sql_connectome
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sql_connectome"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      SQL_CONNECTOME_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sql_connectome
      SQL_CONNECTOME_API_TOKEN: ci-test-token
      SQL_CONNECTOME_READ_SCHEMAS: bt2,public,sql_connectome
      SQL_CONNECTOME_RECOVERY_TARGET_URL: postgresql://postgres:postgres@localhost:5432/sql_connectome_restore
      SQL_CONNECTOME_PG_DUMP_BIN: .github/bin/pg_dump17
      SQL_CONNECTOME_PG_RESTORE_BIN: .github/bin/pg_restore17
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e '.[dev]'

      - name: Apply migrations
        run: python scripts/apply_migrations.py

      - name: Verify migration idempotency
        run: python scripts/apply_migrations.py

      - name: Prepare PostgreSQL 17 recovery qualification
        run: |
          chmod +x .github/bin/pg_dump17 .github/bin/pg_restore17
          python - <<'PY'
          import psycopg

          with psycopg.connect(
              "postgresql://postgres:postgres@localhost:5432/postgres",
              autocommit=True,
          ) as conn:
              conn.execute("CREATE DATABASE sql_connectome_restore")
          PY

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q


  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build runtime image
        run: docker build --tag sql-connectome-ci .

      - name: Qualify runtime image
        run: >-
          docker run --rm sql-connectome-ci
          python -c "import platform; import sql_connectome; from sql_connectome.app import app; import sql_connectome.mcp_server as mcp_server; assert platform.python_version_tuple()[:2] == ('3', '14'); assert app.title == 'SQL Connectome'; assert callable(mcp_server.build_mcp_server); print('container-python=' + platform.python_version()); print('sql-connectome=' + sql_connectome.__version__)"
