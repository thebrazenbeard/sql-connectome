name: BT2 PostgreSQL V4 to SQL Connectome MCP qualification

on:
  pull_request:
    paths:
      - 'src/sql_connectome/db.py'
      - 'src/sql_connectome/mcp_server.py'
      - 'tests/test_bt2_v4_live_mcp.py'
      - '.github/workflows/bt2-v4-lantern-mcp.yml'
  push:
    branches: [main]
    paths:
      - 'src/sql_connectome/db.py'
      - 'src/sql_connectome/mcp_server.py'
      - 'tests/test_bt2_v4_live_mcp.py'
      - '.github/workflows/bt2-v4-lantern-mcp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned-postgresql16:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bt2_sql_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d bt2_sql_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bt2_sql_ci
      SQL_CONNECTOME_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bt2_sql_ci
      PGPASSWORD: postgres
      PYTHONDONTWRITEBYTECODE: "1"
      BT2_SQL_V4_EPHEMERAL_QUALIFICATION: "1"

    steps:
      - name: Check out SQL Connectome PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Check out pinned BT2 V4 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: thebrazenbeard/bt2
          ref: ba830cc2914813c3b4e76751f77b1cf3a132a5c4
          path: bt2-source
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Bind PostgreSQL 16 service identity
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'SELECT version();'
          docker inspect '${{ job.services.postgres.id }}' --format '{{.Id}} {{.Image}} {{.Config.Image}} {{.State.Running}}'
          echo "POSTGRES_CONTAINER_ID=${{ job.services.postgres.id }}" >> "$GITHUB_ENV"

      - name: Verify pinned BT2 source package
        working-directory: bt2-source
        run: python tools/qualification/test_lantern_postgresql_v4_source_binding.py

      - name: Canonically rebuild BT2 V4 in blank PostgreSQL 16
        working-directory: bt2-source
        run: |
          python tools/qualification/run_postgres16_blank_rebuild.py \
            --database-url "$DATABASE_URL" \
            --expected-package-digest b23d5320de6d29fc0039f47b412136b5f9613fd87dd5d4ecb03367237372f497 \
            --postgres-container-id "$POSTGRES_CONTAINER_ID" \
            --evidence-out /tmp/bt2_v4_rebuild_evidence.json

      - name: Install SQL Connectome under test
        run: python -m pip install -e '.[dev]'

      - name: Apply SQL Connectome migrations to the same database
        run: |
          python scripts/apply_migrations.py
          python scripts/apply_migrations.py

      - name: Read governed Lantern cut through real MCP client twice
        run: python -m pytest -q tests/test_bt2_v4_live_mcp.py

      - name: Print immutable BT2 reconstruction evidence
        if: always()
        run: |
          if test -f /tmp/bt2_v4_rebuild_evidence.json; then
            cat /tmp/bt2_v4_rebuild_evidence.json
          fi
