name: Engine validation defect
description: Report a difference between static SQL analysis and a real target engine validator.
title: "[Engine validation] "
body:
  - type: dropdown
    id: engine
    attributes:
      label: Validation engine
      options:
        - PostgreSQL
        - DuckDB
        - Other / proposed
    validations:
      required: true

  - type: textarea
    id: sql
    attributes:
      label: SQL
      render: sql
    validations:
      required: true

  - type: textarea
    id: static
    attributes:
      label: Static result
      description: What did parse/bind/transpile report?
    validations:
      required: true

  - type: textarea
    id: engine_result
    attributes:
      label: Engine result
      description: Include SQLSTATE/error class or plan evidence, without secrets.
    validations:
      required: true

  - type: textarea
    id: runtime
    attributes:
      label: Runtime identity
      description: Engine/version and relevant session/catalog context.
    validations:
      required: true
