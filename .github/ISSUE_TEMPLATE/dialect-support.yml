name: Dialect support or coverage gap
description: Request a new SQL-family dialect or document missing capability coverage.
title: "[Dialect] "
body:
  - type: input
    id: dialect
    attributes:
      label: Dialect / engine
      description: Name the engine and, when known, the exact version.
      placeholder: "Example: PostgreSQL 18, Snowflake current, Trino 480"
    validations:
      required: true

  - type: textarea
    id: sql
    attributes:
      label: Representative SQL
      description: Provide the smallest SQL statement that demonstrates the missing coverage.
      render: sql
    validations:
      required: true

  - type: textarea
    id: semantics
    attributes:
      label: Expected semantics
      description: Explain what the statement means in the source engine, including edge cases.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Link official vendor documentation, standards text, or reproducible engine output.
    validations:
      required: true

  - type: checkboxes
    id: boundaries
    attributes:
      label: Claim boundary
      options:
        - label: I am not claiming parser acceptance proves runtime equivalence.
          required: true
        - label: I have not included secrets or production credentials.
          required: true
